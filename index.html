<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educredentials - My Credentials</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 style="font-size: 18px; font-weight: 600;">Menu</h1>
            </div>
            <ul class="sidebar-nav">
                <li class="active">
                    <i class="icon">📄</i> My Credentials
                </li>
                <li>
                    <i class="icon">🏫</i> Institutions
                </li>
                <li>
                    <i class="icon">👤</i> Profile
                </li>
                <li>
                    <i class="icon">📧</i> Inbox
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-logo">Educredentials</div>
                <div class="topbar-user">
                    <span class="topbar-user-name">Petra Pentila</span>
                    <div class="topbar-user-avatar">PP</div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <!-- Breadcrumb -->
                <nav class="breadcrumb">
                    <span>My Credentials</span>
                    <i>›</i>
                    <span>Example Corp</span>
                    <i>›</i>
                    <span>Teamwork</span>
                </nav>

                <!-- Achievement Placeholder -->
                <div class="achievement-placeholder">
                    <h2>Achievement</h2>
                    <p>Credential placeholder</p>
                    <div class="badge-placeholder">
                        <i>🏅</i>
                    </div>
                    <div class="placeholder-text">Badge will appear here</div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
